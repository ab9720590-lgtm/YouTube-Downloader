- name: Install Android build dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      autoconf \
      automake \
      build-essential \
      ccache \
      cmake \
      git \
      libffi-dev \
      libltdl-dev \
      libncurses5-dev \
      libncursesw5-dev \
      libssl-dev \
      libtool \
      openjdk-17-jdk \
      pkg-config \
      python3-pip \
      unzip \
      zip \
      zlib1g-dev

- name: Install Buildozer and Cython
  run: |
    python3 -m pip install --upgrade pip setuptools wheel
    python3 -m pip install buildozer "Cython==0.29.34"

- name: Build APK
  run: buildozer android debug- name: Install Android build dependencies
